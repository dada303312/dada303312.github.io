<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="830" viewBox="0 0 1400 830">
  <defs><linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#1f2937"/></linearGradient><linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs>
  <rect width="1400" height="830" rx="30" fill="url(#bg3)"/>
  <text x="70" y="78" fill="#f8fafc" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="700">开发阶段评估</text>
  <text x="70" y="114" fill="#94a3b8" font-family="Microsoft YaHei, sans-serif" font-size="18">这是“原型成熟度”判断，不是正式游戏完成百分比</text>
  <g font-family="Microsoft YaHei, sans-serif" font-size="18">
    <text x="80" y="182" fill="#e5e7eb">工程基础与运行配置</text><rect x="350" y="158" width="850" height="32" rx="16" fill="#263243"/><rect x="350" y="158" width="765" height="32" rx="16" fill="url(#bar)"/><text x="1225" y="182" fill="#a5f3fc">90%</text>
    <text x="80" y="252" fill="#e5e7eb">玩家移动与自动战斗</text><rect x="350" y="228" width="850" height="32" rx="16" fill="#263243"/><rect x="350" y="228" width="680" height="32" rx="16" fill="url(#bar)"/><text x="1045" y="252" fill="#a5f3fc">80%</text>
    <text x="80" y="322" fill="#e5e7eb">敌人追击、受击与击退</text><rect x="350" y="298" width="850" height="32" rx="16" fill="#263243"/><rect x="350" y="298" width="663" height="32" rx="16" fill="url(#bar)"/><text x="1028" y="322" fill="#a5f3fc">78%</text>
    <text x="80" y="392" fill="#e5e7eb">经验、升级与三选一</text><rect x="350" y="368" width="850" height="32" rx="16" fill="#263243"/><rect x="350" y="368" width="578" height="32" rx="16" fill="url(#bar)"/><text x="943" y="392" fill="#a5f3fc">68%</text>
    <text x="80" y="462" fill="#e5e7eb">关卡、波次、内容量</text><rect x="350" y="438" width="850" height="32" rx="16" fill="#263243"/><rect x="350" y="438" width="170" height="32" rx="16" fill="url(#bar)"/><text x="535" y="462" fill="#fcd34d">20%</text>
    <text x="80" y="532" fill="#e5e7eb">像素美术、动画与表现</text><rect x="350" y="508" width="850" height="32" rx="16" fill="#263243"/><rect x="350" y="508" width="68" height="32" rx="16" fill="url(#bar)"/><text x="433" y="532" fill="#fca5a5">8%</text>
    <text x="80" y="602" fill="#e5e7eb">HUD、菜单、死亡与重开</text><rect x="350" y="578" width="850" height="32" rx="16" fill="#263243"/><rect x="350" y="578" width="102" height="32" rx="16" fill="url(#bar)"/><text x="467" y="602" fill="#fca5a5">12%</text>
    <text x="80" y="672" fill="#e5e7eb">音频、存档、发布</text><rect x="350" y="648" width="850" height="32" rx="16" fill="#263243"/><rect x="350" y="648" width="8" height="32" rx="4" fill="url(#bar)"/><text x="373" y="672" fill="#fca5a5">0%</text>
  </g>
  <rect x="70" y="718" width="1260" height="70" rx="18" fill="#172033" stroke="#334155"/>
  <text x="100" y="760" fill="#e2e8f0" font-family="Microsoft YaHei, sans-serif" font-size="19">结论：核心机制原型已经成立，下一阶段的关键不是继续堆代码，而是把“一局完整游戏”闭合起来。</text>
</svg>