<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1f2937"/></linearGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <filter id="glow"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#8b5cf6" flood-opacity=".55"/></filter>
  </defs>
  <rect width="1400" height="800" rx="30" fill="url(#bg)"/>
  <text x="70" y="72" fill="#f8fafc" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="36" font-weight="700">10 分钟一局的目标节奏</text>
  <text x="70" y="108" fill="#94a3b8" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="18">压力不是一直升高，而是“加压—短暂释放—再加压”，让玩家能读懂风险并形成自己的构筑</text>

  <rect x="140" y="170" width="1170" height="446" rx="20" fill="#111a2b" stroke="#2a3850"/>
  <rect x="140" y="170" width="117" height="446" fill="#164e63" opacity=".35"/>
  <rect x="257" y="170" width="234" height="446" fill="#1d4ed8" opacity=".23"/>
  <rect x="491" y="170" width="351" height="446" fill="#6d28d9" opacity=".22"/>
  <rect x="842" y="170" width="351" height="446" fill="#b45309" opacity=".21"/>
  <rect x="1193" y="170" width="117" height="446" fill="#be123c" opacity=".30"/>

  <text x="198" y="205" text-anchor="middle" fill="#a5f3fc" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700">学习</text>
  <text x="374" y="205" text-anchor="middle" fill="#bfdbfe" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700">第一次选择</text>
  <text x="666" y="205" text-anchor="middle" fill="#ddd6fe" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700">构筑成形</text>
  <text x="1018" y="205" text-anchor="middle" fill="#fde68a" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700">检验构筑</text>
  <text x="1251" y="205" text-anchor="middle" fill="#fecdd3" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700">收束</text>

  <g stroke="#334155" stroke-width="1">
    <line x1="140" y1="590" x2="1310" y2="590"/><line x1="140" y1="500" x2="1310" y2="500"/><line x1="140" y1="410" x2="1310" y2="410"/><line x1="140" y1="320" x2="1310" y2="320"/><line x1="140" y1="230" x2="1310" y2="230"/>
  </g>
  <g fill="#64748b" font-family="Microsoft YaHei, sans-serif" font-size="15">
    <text x="105" y="596" text-anchor="end">低</text><text x="105" y="506" text-anchor="end">中</text><text x="105" y="416" text-anchor="end">高</text><text x="105" y="326" text-anchor="end">很高</text><text x="105" y="236" text-anchor="end">极限</text>
  </g>

  <path d="M140 565 C190 560 210 545 257 535 C320 520 360 470 420 455 C470 442 495 420 555 385 C610 350 660 365 705 340 C760 305 820 315 875 270 C930 225 975 245 1030 210 C1080 180 1140 195 1193 165 C1225 145 1260 130 1310 105" fill="none" stroke="url(#curve)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>

  <g fill="#22d3ee"><circle cx="257" cy="535" r="9"/></g><text x="257" y="515" text-anchor="middle" fill="#a5f3fc" font-family="Microsoft YaHei, sans-serif" font-size="14">首轮升级</text>
  <g fill="#8b5cf6"><circle cx="555" cy="385" r="9"/></g><text x="555" y="360" text-anchor="middle" fill="#ddd6fe" font-family="Microsoft YaHei, sans-serif" font-size="14">远程敌人加入</text>
  <g fill="#f59e0b"><circle cx="875" cy="270" r="9"/></g><text x="875" y="245" text-anchor="middle" fill="#fde68a" font-family="Microsoft YaHei, sans-serif" font-size="14">精英波次</text>
  <g fill="#fb7185"><circle cx="1250" cy="128" r="11"/></g><text x="1250" y="105" text-anchor="middle" fill="#fecdd3" font-family="Microsoft YaHei, sans-serif" font-size="14">Boss / 结算</text>

  <g fill="#94a3b8" font-family="Microsoft YaHei, sans-serif" font-size="15">
    <text x="140" y="666">0 分钟</text><text x="374" y="666" text-anchor="middle">1</text><text x="608" y="666" text-anchor="middle">3</text><text x="842" y="666" text-anchor="middle">6</text><text x="1076" y="666" text-anchor="middle">9</text><text x="1310" y="666" text-anchor="end">10 分钟</text>
  </g>
  <g font-family="Microsoft YaHei, sans-serif" font-size="16">
    <text x="150" y="720" fill="#cbd5e1">0—1 分钟：让玩家理解移动、自动攻击和拾取，不制造失败惩罚。</text>
    <text x="150" y="751" fill="#cbd5e1">1—6 分钟：用两次明显升级建立构筑方向，再引入需要改变站位的敌人。</text>
    <text x="150" y="782" fill="#cbd5e1">6—10 分钟：精英和 Boss 检验构筑；结束时要让玩家知道自己为什么赢或输。</text>
  </g>
</svg>